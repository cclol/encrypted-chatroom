name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.89.0"

jobs:
  rust-check-and-test:
    name: Test native crates & build WASM worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (native)
        run: cargo clippy --workspace --exclude web-client --all-targets -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy -p web-client --target wasm32-unknown-unknown -- -D warnings

      - name: Run unit & integration tests
        run: cargo test -p core-crypto -p relay-server -p web-client

      - name: Test deployment URL/CSP generator
        run: python3 scripts/configure_pages_origin.py --self-test

      - name: Build WASM worker (release)
        run: cargo build --release --locked --target wasm32-unknown-unknown -p web-client

      - name: Install wasm-bindgen-cli (pinned to workspace version)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Generate JS/WASM bindings and measure bundle size
        run: |
          wasm-bindgen --target web --no-typescript --out-dir web/pkg target/wasm32-unknown-unknown/release/web_client.wasm
          gzip -k -9 web/pkg/web_client_bg.wasm
          ls -lh web/pkg/web_client_bg.wasm web/pkg/web_client_bg.wasm.gz web/pkg/web_client.js web/app.js web/worker.js
          rm web/pkg/web_client_bg.wasm.gz

      - name: Upload verified static web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geistr-web-dist
          path: web/
          retention-days: 7
